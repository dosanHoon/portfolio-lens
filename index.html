<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>포폴 렌즈</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">포폴 렌즈</p>
      <h1>보유만 넣으면<br />비중과 국장·미장이 나옵니다</h1>
      <p class="disclaimer">투자 조언이 아닙니다. 보유는 이 기기에만 남습니다. 시세는 직접 입력합니다.</p>

      <section class="hero">
        <div class="label">총 평가액</div>
        <div class="amount" id="total">0원</div>
      </section>

      <div class="split">
        <section class="card">
          <div class="label">국장</div>
          <div class="pct" id="krPct">—</div>
          <div class="sub" id="krSub"></div>
        </section>
        <section class="card">
          <div class="label">미장</div>
          <div class="pct" id="usPct">—</div>
          <div class="sub" id="usSub"></div>
        </section>
      </div>

      <section class="section">
        <h2>종목 비중</h2>
        <div class="list" id="weights"></div>
      </section>

      <section class="section">
        <h2>종목 추가</h2>
        <form class="form" id="addForm">
          <div class="fields">
            <div class="field">
              <label for="name">이름</label>
              <input id="name" name="name" autocomplete="off" placeholder="삼성전자" required />
            </div>
            <div class="field">
              <label for="ticker">티커</label>
              <input id="ticker" name="ticker" autocomplete="off" placeholder="005930" required />
            </div>
            <div class="field">
              <label for="shares">수량</label>
              <input id="shares" name="shares" inputmode="decimal" placeholder="10" required />
            </div>
            <div class="field">
              <label for="price">현재가 (원)</label>
              <input id="price" name="price" inputmode="decimal" placeholder="80000" required />
            </div>
            <div class="field wide">
              <label for="avg">평단 (원, 선택)</label>
              <input id="avg" name="avg" inputmode="decimal" placeholder="비워두면 손익 없음" />
            </div>
          </div>
          <p class="err" id="addErr"></p>
          <button class="btn" type="submit">추가</button>
        </form>
      </section>

      <section class="section">
        <h2>현금</h2>
        <form class="form" id="cashForm">
          <div class="fields">
            <div class="field wide">
              <label for="cash">금액 (원)</label>
              <input id="cash" name="cash" inputmode="decimal" placeholder="0" />
            </div>
          </div>
          <p class="err" id="cashErr"></p>
          <button class="btn" type="submit">반영</button>
        </form>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
